<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Sistema Solar Honório</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="section" style="padding-top: 140px;">
    <div class="container">
      <h2 class="section-title">Solicitar Orçamento</h2>
      <p class="section-subtitle">Preencha e retornamos em até 24h.</p>

      <form id="formCadastro" class="form-box" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" required placeholder="Seu nome">
          </div>
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="voce@email.com">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpfCnpj">CPF ou CNPJ *</label>
            <input type="text" id="cpfCnpj" required placeholder="000.000.000-00" maxlength="18">
          </div>
          <div class="form-group">
            <label for="telefone">Telefone / WhatsApp *</label>
            <div class="phone-group">
              <select id="countryCode" aria-label="Código do país">
                <option value="+55" data-mask="br" selected>🇧🇷 +55</option>
                <option value="+54" data-mask="ar">🇦🇷 +54</option>
                <option value="+595" data-mask="py">🇵🇾 +595</option>
                <option value="+598" data-mask="uy">🇺🇾 +598</option>
                <option value="+1" data-mask="us">🇺🇸 +1</option>
                <option value="+351" data-mask="pt">🇵🇹 +351</option>
                <option value="+34" data-mask="es">🇪🇸 +34</option>
                <option value="+39" data-mask="it">🇮🇹 +39</option>
                <option value="+49" data-mask="de">🇩🇪 +49</option>
                <option value="+44" data-mask="uk">🇬🇧 +44</option>
                <option value="+81" data-mask="jp">🇯🇵 +81</option>
                <option value="+86" data-mask="cn">🇨🇳 +86</option>
              </select>
              <input type="tel" id="telefone" required placeholder="(44) 99999-9999">
            </div>
          </div>
        </div>

        <div class="form-row" style="grid-template-columns: 160px 1fr;">
          <div class="form-group">
            <label for="cep">CEP *</label>
            <input type="text" id="cep" required placeholder="00000-000" maxlength="9" inputmode="numeric">
          </div>
          <div class="form-group">
            <label for="endereco">Logradouro</label>
            <input type="text" id="endereco" placeholder="Rua, avenida...">
          </div>
        </div>

        <div class="form-row" style="grid-template-columns: 120px 1fr 1fr;">
          <div class="form-group">
            <label for="numero">Número *</label>
            <input type="text" id="numero" required placeholder="123">
          </div>
          <div class="form-group">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" placeholder="Apto, bloco...">
          </div>
          <div class="form-group">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro">
          </div>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr 80px;">
          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Cidade">
          </div>
          <div class="form-group">
            <label for="estado">UF</label>
            <input type="text" id="estado" maxlength="2" placeholder="PR" style="text-transform:uppercase;">
          </div>
        </div>

        <div class="form-group">
          <label for="tipoSistema">Tipo de sistema</label>
          <select id="tipoSistema">
            <option>ON GRID</option>
            <option>OFF GRID</option>
            <option>ZERO GRID</option>
            <option>HÍBRIDO</option>
            <option>BESS</option>
            <option>Ainda não sei</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem (opcional)</label>
          <textarea id="mensagem" rows="3" placeholder="Conta pra gente sobre seu projeto..."></textarea>
        </div>

        <label class="checkbox-label form-terms">
          <input type="checkbox" id="termos" required>
          <span>Autorizo o contato da Sistema Solar Honório.</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-paper-plane"></i> Enviar
        </button>
        <div id="formStatus" class="form-status"></div>
      </form>
    </div>
  </section>

  <div id="footer"></div>
  <script src="script.js"></script>
</body>
</html>
