<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Sistema Solar Honório</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Biblioteca do Telefone Internacional -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.4/build/css/intlTelInput.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="section" style="padding-top: 120px;">
    <div class="container">
      <h2 class="section-title">Solicitar Orçamento</h2>
      <p class="section-subtitle">Preencha e retornamos em até 24h.</p>

      <form id="formCadastro" class="form-box" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" required placeholder="Seu nome">
          </div>
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="voce@email.com">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpfCnpj">CPF ou CNPJ *</label>
            <input type="text" id="cpfCnpj" required placeholder="000.000.000-00" maxlength="18">
          </div>
          <div class="form-group">
            <label for="telefone">Telefone / WhatsApp *</label>
            <input type="tel" id="telefone" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cep">CEP *</label>
            <input type="text" id="cep" required placeholder="00000-000" maxlength="9" inputmode="numeric">
          </div>
          <div class="form-group">
            <label for="endereco">Logradouro</label>
            <input type="text" id="endereco" placeholder="Rua, avenida...">
          </div>
        </div>

        <div class="form-row row-3">
          <div class="form-group">
            <label for="numero">Número *</label>
            <input type="text" id="numero" required placeholder="123">
          </div>
          <div class="form-group">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" placeholder="Apto, bloco...">
          </div>
          <div class="form-group">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro">
          </div>
        </div>

        <div class="form-row row-uf">
          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Cidade">
          </div>
          <div class="form-group">
            <label for="estado">UF</label>
            <input type="text" id="estado" maxlength="2" placeholder="PR" style="text-transform:uppercase;">
          </div>
        </div>

        <div class="form-group">
          <label for="tipoSistema">Tipo de sistema</label>
          <select id="tipoSistema">
            <option>ON GRID</option>
            <option>OFF GRID</option>
            <option>ZERO GRID</option>
            <option>HÍBRIDO</option>
            <option>BESS</option>
            <option>Ainda não sei</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem (opcional)</label>
          <textarea id="mensagem" rows="4" placeholder="Conte pra gente sobre seu projeto, consumo ou dúvidas..."></textarea>
        </div>

        <div class="form-terms">
          <label class="checkbox-label">
            <input type="checkbox" id="termos" required>
            <span>Autorizo o contato da Sistema Solar Honório.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-paper-plane"></i> Enviar Cadastro
        </button>
        <div id="formStatus" class="form-status"></div>
      </form>
    </div>
  </section>

  <div id="footer"></div>

  <!-- JS da Biblioteca de Telefone -->
  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@23.0.4/build/js/intlTelInput.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
